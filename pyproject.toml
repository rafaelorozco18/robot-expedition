[project]
name = "robot-expedition"
version = "0.2.0"
description = "Robot Expedition: bípedo que aprende por experimentos de dificultad creciente"
requires-python = ">=3.11"
dependencies = ["gymnasium>=1.4", "mujoco>=3.0", "numpy>=2.0", "pyyaml>=6.0", "stable-baselines3>=2.9"]

[project.optional-dependencies]
mlops = ["dvc>=3.60", "mlflow>=3.0", "pandas"]
dev = ["pytest>=8"]

[project.scripts]
expedicion = "expedicion.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["expedicion"]
