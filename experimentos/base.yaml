# Serie Marte: valores comunes. Cada exp-1NN.yaml sobreescribe solo lo que cambia.
# La serie anterior (plan de 50) está en experimentos/plan-50/ y en los tags exp-001…exp-028.
robot: robots/bipedo-v2.xml
tarea: de_pie
parte_de: null
control:
  rango: 0.8
  filtro: 0.3
ambiente:
  duracion_s: 10
  frame_skip: 5
  ruido_inicial: 0.1
  altura_minima: 0.85
  inclinacion_maxima: 35
  empujon_entrenando: 0.0
  empujon_ms: 0.4
  empujones_por_episodio: 1
  velocidad_inicial: 0.2
recompensa:
  vivo: 1.0
  altura: 1.0
  postura: 0.5
  quieto: 0.3
  esfuerzo: 0.05
  suavidad: 0.05
  caida: 50.0
entrenamiento:
  pasos: 2000000
  procesos: 4
  robots_por_proceso: 16
  hilos: 1
  semillas:
  - 0
  n_steps: 64
  batch_size: 2048
  n_epochs: 5
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  log_std_init: -1.5
  escala_recompensa: 0.05
  red:
  - 256
  - 256
  fotos: 24
  aprendiz: 0.25
  pasos_minimos: 300000
  perfeccionar: 0.4       # al aprobar 3 fotos seguidas entrena un 40 % más (mínimo 300 mil pasos) y para
  fotos_cuadraticas: true
evaluacion:
  semilla: 2026
  episodios_por_condicion: 12
  episodios_por_foto: 3
  planetas:
  - marte
  perturbaciones:
  - ninguna
  - empujon
aprobar:
  tasa_exito: 0.95
  perturbacion: ninguna
planetas_entrenamiento:
- marte
