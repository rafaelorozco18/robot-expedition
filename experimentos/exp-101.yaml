id: exp-101
titulo: De pie
estado: activo
tarea: de_pie
pregunta: ¿Recupera el equilibrio y se mantiene de pie en Marte?
agrega: Articulaciones y gravedad de Marte, arrancando desequilibrado
criterio: Aguanta 10 s en ≥ 95 %
entrenamiento:
  pasos: 1500000
  semillas:
  - 0
  reintentos: 0
trampa: 'Agacharse para no caer: la altura mínima y la inclinación máxima lo impiden.'
pendiente: 'Arranca con 0,1 rad de ruido en las articulaciones y 0,2 m/s en el torso:
  sin eso, en Marte el servo solo ya lo sostiene. Con 0,35 m/s y 700 mil pasos solo
  aprobaba el 33 %.'
