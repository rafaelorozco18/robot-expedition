id: exp-101
titulo: De pie
estado: activo
tarea: de_pie
pregunta: ¿Recupera el equilibrio y se mantiene de pie en Marte?
agrega: Articulaciones y gravedad de Marte, arrancando desequilibrado
criterio: Aguanta 10 s en ≥ 95 %
entrenamiento:
  pasos: 700000
trampa: 'Agacharse para no caer: la altura mínima y la inclinación máxima lo impiden.'
pendiente: 'Arranca con 0,12 rad de ruido en las articulaciones y 0,35 m/s en el torso:
  sin eso, en Marte el servo solo ya lo sostiene.'
