pendiente: 'Experimento pedido por el usuario el 2026-11-19: llegar a balizas en un
  campo de rocas que no se pueden cruzar, con parches de arena, grava y barro, y varias
  rutas posibles. Diseño jerárquico: el caminante es el campeón del Exp 8 (congelado);
  un navegador PPO aprende a elegir cada 1 s una de cinco maniobras (recto, curva
  izq./der., giro izq./der.) a partir de 15 sensores de distancia y la baliza (nueva
  familia de modelos: 23 observaciones, 5 acciones). El navegador entrena en un simulador
  cinemático calibrado con el caminante real (experimentos/calibracion-caminante.json)
  y se evalúa en MuJoCo completo. Calibración: con maniobras al azar cada 1 s el caminante
  se cae en 2 a 3 de 12 episodios de 30 s; el giro a la izquierda real avanza 0,34
  m/s. Hallazgo: las rocas de MuJoCo se movían como geoms fijos del mundo y el robot
  las atravesaba (la jerarquía de envolventes quedaba vieja); ahora son cuerpos mocap
  con radios fijos (0,35 a 0,70 m). Con rocas sólidas, en 16 episodios: la regla «ir
  directo» choca 15 veces (0 éxitos); el navegador aprendido (800 mil pasos) esquiva
  casi siempre (2 choques) pero el caminante se cae en 10. Un primer diseño con 5
  maniobras bruscas hacía caer al caminante en 10 de 12; se cambió a 7 direcciones
  ejecutadas con el controlador del Exp 8. Semilla 1: el campeón del Exp 8 congelado
  (línea base). Semilla 2: ajuste fino del caminante en la exploración. Hallazgo:
  un pie llegó a 0,67 m del centro del robot al chocar; el alcance del robot en planta
  se corrigió de 0,32 a 0,55 m. Comparación en MuJoCo (24 episodios nuevos 5000+,
  mismo caminante): regla «ir directo» 0 (21 choques), aleatorio 0, base 1, suave
  5 (caídas de 12 a 3), robusto semillas 1/2/3: 6, 3 y 2. Navegador oficial: robusto
  semilla 1; confirmación 3000+: 5 de 24. Semilla 2 del caminante (ajuste fino, entrenada
  con el navegador base): 1 de 24 con ese navegador; no reduce las caídas. Cambio
  de mundo pedido por el usuario (2026-11-19, 09:10): campo a la mitad (7 m × 7 m),
  balizas separadas al menos 3,5 m entre sí y 2 m de la salida, ordenadas por cercanía
  (antes la última podía caer sobre la salida), y parches de piso sobre la ruta (antes
  quedaban donde el robot no pasaba). El navegador sigue entrenando desde el anterior:
  no pierde lo aprendido. Pisos medidos en el mapa nuevo con el navegador sin reentrenar
  (24 episodios): firme 3 llegadas (14 choques), arena y grava 3 (12 caídas), barro
  0 (16 caídas). Girar sobre barro es el límite conocido del caminante (Exp 7): el
  barro sale y la arena y la grava van en el tramo de llegada a cada baliza, casi
  recto. Mapa nuevo (24 episodios 5000+): regla «ir directo» 0 (22 choques); robusto
  del mapa viejo sin reentrenar 0; adaptado en el simulador 3; ajustado en MuJoCo
  (foto 2,32 M) 6 y su foto final 4. Navegador oficial: la foto 2,32 M; confirmación
  3000+: 4 de 24. El ajuste en MuJoCo duplicó las llegadas del mismo navegador en
  el mapa nuevo (3 → 6). La semilla 1 del caminante sigue congelada.'
