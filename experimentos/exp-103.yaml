id: exp-103
estado: activo
titulo: De pie con viento
tarea: de_pie
parte_de: exp-101
pregunta: ¿Se mantiene de pie con viento y ráfagas en Marte?
agrega: Viento constante de 3 a 8 N, en cualquier dirección, más ráfagas de 3 a 8
