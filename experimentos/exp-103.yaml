aprobar:
  tasa_exito: 0.9
entrenamiento:
  pasos: 1000000
  reintentos: 0
  procesos: 5
  semillas:
  - 1
trampa: 'Inclinarse siempre hacia un lado: la dirección del viento cambia en cada
  episodio.'
ambiente:
  velocidad_inicial: 0.0
pendiente: 'Con viento de 6 a 14 N el primer intento quedó en 0 %: el modelo del Exp
