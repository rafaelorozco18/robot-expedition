pendiente: 'Calidad ≥ 55/100, la del Exp 3: no puede empeorar la marcha mientras aprende
  lo nuevo. Semilla 1 (6 M desde el campeón del Exp 6, con repaso): 0 % y olvidó casi
  todo (De pie 75 %, el resto 0 a 17 %). Al entrenar, el éxito subió a 39 % hacia
  los 260 mil pasos y luego bajó; la mejor foto hace 8 de 40 en episodios nuevos y
  el campeón del Exp 6 sin entrenar, 3 de 40. Las caídas son en pisos sueltos. La
  semilla 2 baja la tasa de aprendizaje a 1e-4 (3 M de pasos). Semilla 2 (tasa 1e-4,
  3 M): ya no se desarma, pero el recorrido sube despacio (7 de 40 en episodios nuevos).
  Sobre piso firme el mismo recorrido lo cumplen 24 de 40 el campeón del Exp 6 sin
  entrenar y 28 de 40 la semilla 2: lo difícil son los pisos sueltos al girar. El
  Exp 7 agrega dos cosas a la vez (órdenes cambiantes y pisos sueltos). La semilla
  3 continúa la 2 con 6 M más. Semilla 3 (6 M más desde la 2): se estanca; la mejor
  foto (1,26 M) hace 15 de 40 recorridos nuevos y la final 6 de 40. Pendiente de decisión
  del usuario: partir el Exp 7 en recorrido sobre piso firme y luego sobre terreno.
  Semilla 4 (desde el campeón del Exp 6, tasa 1e-4, 6 M): al entrenar, la intensidad
  de los pisos se sortea por episodio entre 0 (firme) y 1 (la del examen); el examen
  no cambia. Semilla 4: mejor foto 12 de 40 recorridos nuevos; sobre piso firme 36
  de 40 (90 %), igual hasta intensidad 0,5; 25 de 40 con 0,75. Por piso: arena 36,
  grava 17 y barro 0 de 40: lo que falla es girar en el barro. Semilla 5 (continúa
  la 4, 6 M): intensidad al entrenar entre 0,5 y 1. Semilla 5: 21 de 40 recorridos
  nuevos (52 %); firme 36, arena 30, grava 10 y barro 2 de 40. En barro no se cae:
  aguanta 24 s pero va lento (error 0,26–0,29 m/s, máximo 0,25); en el examen mixto
  la mayoría de los fallos son caídas. Olvidó la curva (1 de 40): se arreglará con
  destilación. Semilla 6 (continúa la 5, 6 M): intensidad entre 0,75 y 1. Semilla
  6: entre fotos varía mucho (13 a 29 de 40); la de 5,5 M hace 29 y la final 28 de
  40. Semilla 7 (continúa la 6, 6 M): tasa de aprendizaje 5e-5 para estabilizar. Semilla
  7: la foto final hace 30 y 26 de 40 recorridos nuevos (70 %), la más pareja. Semilla
  8: receta del Exp 6, parte del campeón del Exp 6 (sabe todo lo anterior) y destila
  con maestros del mismo linaje: la semilla 7 en el recorrido y el campeón del Exp
  6 en lo anterior; después PPO con la política congelada (400 mil pasos). Semilla
  8: en validación (40 episodios) el recorrido sube de 15 % a 67 % (ronda 9) sin perder
  lo anterior (curva 100 %, esquina 100 %, Terreno 72 %, De pie 92 %); seguía subiendo.
  La semilla 9 continúa la destilación desde la 8 con 12 rondas más, como la semilla
  5 del Exp 6. Una semilla 9 que seguía destilando desde la 8 no la superó en 5 rondas
  (52 a 62 %): se cortó. El techo es el maestro (70 %): se entrena uno mejor siguiendo
  la semilla 7 con PPO. Maestros para subir el techo (fuera de la serie, models/prueba-*):
  seguir la semilla 7 con PPO 6 M más llega a 31 de 40 (igual que la 7); el promedio
  de tres maestros del linaje, 56 de 80 (70 %); practicar con pisos más duros que
  el examen (0,9 a 1,25), 26 de 40. La semilla 7 cumple 37 de 40 con pisos al 75 %
  y 30 con los del examen: falla el barro (9 de 40 solo barro) por inclinarse o ir
  lento. La semilla 8 en 40 episodios nuevos (3000+): recorrido 20, curva 39, esquina
  36, De pie 31, Caminar bien 40, Terreno 35 de 40. Semilla 9: afina la 8 con PPO
  (tasa 3e-5, 2 M, con repaso), sin destilar, para subir el recorrido sin desarmar
  lo anterior. (La destilación de la semilla 8 usó: maestros {''exp-107'': ''models/exp-107/semilla-7/experto.zip'',
  ''exp-106'': ''models/exp-106/semilla-5/experto.zip'', ''exp-105'': ''models/exp-106/semilla-5/experto.zip'',
  ''exp-103'': ''models/exp-106/semilla-5/experto.zip'', ''exp-104'': ''models/exp-106/semilla-5/experto.zip'',
  ''exp-101'': ''models/exp-106/semilla-5/experto.zip''}, 12 rondas.) Semilla 9: 17
  a 22 de 40; en el examen oficial (24 episodios) 42 %, igual que la 8. Campaña del
  2026-11-18: campeón la semilla 6 (recorrido 71 % en el examen, pero olvida la curva,
  25 %, y el Terreno, 67 %). Semilla 10: repite la destilación de la 8 desde el campeón
  del Exp 6 con el doble de recorridos por ronda (48) y 16 rondas. Semilla 10: mejor
  ronda 8; en 40 episodios nuevos (3000+): recorrido 28, curva 37, esquina 39, De
  pie 30, Caminar bien 40 y Terreno 35 de 40.'
