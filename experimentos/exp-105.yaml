pendiente: 'Calidad ≥ 55/100, la del Exp 3: no puede empeorar la marcha mientras aprende
  lo nuevo. Semilla 0 (6 M): 67 % en el examen y 16 de 20 en episodios nuevos; las
  caídas son todas al retomar la marcha tras el giro. La semilla 1 entrena 9 M. Semilla
  1 (9 M): 33 %, cae a mitad del giro: el examen gira a 0,7 rad/s, el extremo del
  rango practicado (0,3 a 0,7). La semilla 2 practica giros de 0,5 a 0,9 rad/s, con
  el examen al centro, y 6 M de pasos. Semilla 2: 58 % (27 de 40 en episodios nuevos);
  la semilla 0 logra 30 de 40. La semilla 3 continúa la semilla 0 con 4 M de pasos
  más, con su rango de giros original (0,3 a 0,7) y ruido bajo. Semilla 3: 50 %. Desde
  la semilla 4, tras el giro la velocidad pedida sube de 0 a 0,5 m/s en 1,5 s en vez
  de saltar de golpe (también en el examen): todas las caídas eran al retomar la marcha.
  Semilla 4: 42 % (14 de 40). Con la rampa en el examen, las semillas 0 y 2 suben
  a 75 % en el examen y a 35 y 34 de 40 (87 % y 85 %) en episodios nuevos. La semilla
  5 repite la configuración de la 4. La semilla 5 aprobó la esquina pero olvidó el
  terreno (0 %). Desde la semilla 6 (2026-11-14) se entrena con repaso: el 30 % de
  los robots practica los Exps 1, 3 y 4 (también olvidaba quedarse de pie), y el campeón
  debe seguir aprobando sus exámenes. Semilla 6 (6 M, con repaso): 46 % en la esquina,
  pero recuerda más: De pie 50 %, Caminar bien 83 %, Terreno 58 % (antes 0 %); la
  curva seguía subiendo y solo el 70 % de los robots practica la esquina, así que
  la semilla 7 entrena 9 M. Semilla 7 (9 M): esquina 100 % sin empujón y 58 % con
  empujón, pero De pie y Terreno en 0 %: el terreno solo tenía 5 de 80 robots repasando.
  La semilla 8 consolida: parte de la 7 y entrena 4 M con la mitad de los robots repasando
  (terreno 4, De pie 2 y Caminar bien 2 de cada 16). Semilla 8: el corte temprano
  solo mira la esquina y paró a los 2 M; recuperó De pie (75 %), Caminar bien (83
  %) y Terreno (58 %) pero la esquina bajó a 42 %. La semilla 9 repite la consolidación
  desde la 7, sin corte temprano y con 6 M. Semilla 9 (6 M desde la 7): esquina 92
  %, calidad 79, Caminar bien 100 %, Terreno 75 %, De pie 50 %: solo falla De pie.
  La semilla 10 consolida desde la 9 con 4 M y más repaso de De pie (4 de cada 16
  robots). Semilla 10 (4 M desde la 9): esquina 92 % (67 % con empujón), Caminar bien
  100 %, Terreno 92 %, De pie 58 %. Con el filtro de servos actual (0,6) el propio
  campeón del Exp 1 hace 67 % en su examen (83 % con su filtro de 0,3): De pie es
  más difícil con servos más lentos. La semilla 11 consolida desde la 10 con 5 de
  cada 16 robots en De pie. Semilla 11: De pie 67 % (el techo del propio campeón del
  Exp 1 con estos servos) pero Terreno bajó a 42 %: las tareas se turnan. La semilla
  12 consolida desde la 10 con 6 M y el repaso parejo entre De pie y Terreno (3 y
  3 de cada 16). Semilla 12 (6 M, repaso parejo): peor en todo (esquina 58 %, Caminar
  bien 75 %, Terreno 42 %). La semilla 13 consolida desde la 10 con el repaso de la
  10 y la tasa de aprendizaje a un tercio (1e-4), para que lo nuevo no borre lo viejo.
  Semilla 13: la esquina se derrumbó (0 %). La semilla 14 repite la receta de la 10
  desde la 10 (otra semilla, misma configuración). Semilla 14: peor (esquina 25 %).
  Un especialista solo en De pie con estos servos hace 35 de 40 (87 %) en episodios
  nuevos: el 80 % es alcanzable. Probar todas las fotos de las semillas 9 a 13 en
  episodios nuevos: ninguna cumple todo. La semilla 15 usa destilación (DAgger): parte
  de la 9 e imita a dos maestros (la 9 en esquina, Caminar bien y Terreno; el especialista
  en De pie), se queda con la mejor ronda en validación y luego PPO afina 3 M con
  repaso. En un prototipo, la destilación sola llegó a De pie 88 %, Caminar bien 100
  %, Terreno 75 % y esquina 62 %. Semilla 15 (destilación y 3 M de PPO): esquina 100
  % sin empujón, De pie 83 % (la primera que lo aprueba), Caminar bien 100 %, pero
  Terreno 42 %: tras la destilación tenía 75 % y cayó en cuanto empezó PPO, cuando
  el ruido vuelve a -2,3. La semilla 16 repite todo con el ruido de PPO en -3,0. Semilla
  16 (ruido de PPO en -3,0): se derrumbó (esquina 17 %, Caminar bien 17 %, Terreno
  0 %, De pie 92 %). La semilla 17 vuelve a la receta de la 15 y agrega un calentamiento
  del crítico: los primeros 500 mil pasos solo aprende la función de valor, porque
  la destilación cambia la política pero no el crítico, y sus primeras ventajas desordenaban
  lo destilado. Semilla 17 (con calentamiento del crítico): peor (esquina 0 %, De
  pie 50 %, Terreno 42 %). La semilla 18 parte de la 15 (solo le faltaba el terreno)
  y solo destila: maestros la propia 15 en esquina y Caminar bien, la 9 en Terreno
  y el especialista en De pie; la política queda congelada durante los 400 mil pasos
  de PPO, que solo ajustan el crítico.'
