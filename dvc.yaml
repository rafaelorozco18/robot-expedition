# Pipeline por experimento: para agregar uno, súmalo a la lista `exp` de cada etapa.
#   escenarios ─┐
#   entrenar ───┴─▶ evaluar ─▶ progreso ─▶ registrar
stages:
  escenarios:
    matrix:
      exp: [exp-001]
    cmd: python -m expedicion escenarios ${item.exp}
    deps:
      - expedicion/evaluar.py
    params:
      - experimentos/${item.exp}-de-pie.yaml:
          - evaluacion
    outs:
      - data/${item.exp}/escenarios.json

  entrenar:
    matrix:
      exp: [exp-001]
      semilla: [0, 1, 2]
    cmd: nice -n 10 python -m expedicion entrenar ${item.exp} --semilla ${item.semilla}
    deps:
      - expedicion/ambiente.py
      - expedicion/tareas.py
      - expedicion/entrenar.py
      - robots/bipedo-v1.xml
    params:
      - experimentos/${item.exp}-de-pie.yaml:
          - control
          - ambiente
          - recompensa
          - entrenamiento
    outs:
      - models/${item.exp}/semilla-${item.semilla}

  evaluar:
    matrix:
      exp: [exp-001]
    cmd: nice -n 10 python -m expedicion evaluar ${item.exp}
    deps:
      - data/${item.exp}/escenarios.json
      - models/${item.exp}
      - expedicion/evaluar.py
      - expedicion/ambiente.py
    outs:
      - data/${item.exp}/trayectorias.jsonl
    metrics:
      - metrics/${item.exp}/evaluacion.json:
          cache: false

  progreso:
    matrix:
      exp: [exp-001]
    cmd: nice -n 10 python -m expedicion progreso ${item.exp}
    deps:
      - metrics/${item.exp}/evaluacion.json
      - expedicion/evaluar.py
    metrics:
      - metrics/${item.exp}/progreso.json:
          cache: false
