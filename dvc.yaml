# Generado por `expedicion pipeline`. El código queda fijado por el tag de cada experimento.
stages:
  escenarios-exp-101:
    cmd: python -m expedicion escenarios exp-101
    deps:
    - experimentos/exp-101.yaml
    - experimentos/base.yaml
    outs:
    - data/exp-101/escenarios.json
  entrenar-exp-101-s0:
    cmd: nice -n 10 python -m expedicion entrenar exp-101 --semilla 0
    deps:
    - experimentos/exp-101.yaml
    - experimentos/base.yaml
    - robots/bipedo-v2.xml
    outs:
    - models/exp-101/semilla-0
  evaluar-exp-101:
    cmd: nice -n 10 python -m expedicion evaluar exp-101
    deps:
    - data/exp-101/escenarios.json
    - models/exp-101/semilla-0
    outs:
    - data/exp-101/trayectorias.jsonl
    metrics:
    - metrics/exp-101/evaluacion.json:
        cache: false
  progreso-exp-101:
    cmd: nice -n 10 python -m expedicion progreso exp-101
    deps:
    - metrics/exp-101/evaluacion.json
    metrics:
    - metrics/exp-101/progreso.json:
        cache: false
  regresion-exp-101:
    cmd: nice -n 10 python -m expedicion regresion exp-101
    deps:
    - metrics/exp-101/evaluacion.json
    metrics:
    - metrics/exp-101/regresion.json:
        cache: false
  evolucion-exp-101:
    cmd: nice -n 10 python -m expedicion evolucion exp-101
    deps:
    - metrics/exp-101/progreso.json
    metrics:
    - metrics/exp-101/evolucion.json:
        cache: false
  escenarios-exp-102:
    cmd: python -m expedicion escenarios exp-102
    deps:
    - experimentos/exp-102.yaml
    - experimentos/base.yaml
    outs:
    - data/exp-102/escenarios.json
  entrenar-exp-102-s0:
    cmd: nice -n 10 python -m expedicion entrenar exp-102 --semilla 0
    deps:
    - experimentos/exp-102.yaml
    - experimentos/base.yaml
    - robots/bipedo-v2.xml
    - metrics/exp-101/evaluacion.json
    outs:
    - models/exp-102/semilla-0
  evaluar-exp-102:
    cmd: nice -n 10 python -m expedicion evaluar exp-102
    deps:
    - data/exp-102/escenarios.json
    - models/exp-102/semilla-0
    outs:
    - data/exp-102/trayectorias.jsonl
    metrics:
    - metrics/exp-102/evaluacion.json:
        cache: false
  progreso-exp-102:
    cmd: nice -n 10 python -m expedicion progreso exp-102
    deps:
    - metrics/exp-102/evaluacion.json
    metrics:
    - metrics/exp-102/progreso.json:
        cache: false
  regresion-exp-102:
    cmd: nice -n 10 python -m expedicion regresion exp-102
    deps:
    - metrics/exp-102/evaluacion.json
    metrics:
    - metrics/exp-102/regresion.json:
        cache: false
  evolucion-exp-102:
    cmd: nice -n 10 python -m expedicion evolucion exp-102
    deps:
    - metrics/exp-102/progreso.json
    metrics:
    - metrics/exp-102/evolucion.json:
        cache: false
