# Generado por `expedicion pipeline`. El código queda fijado por el tag de cada experimento.
stages:
  escenarios-exp-101:
    cmd: python -m expedicion escenarios exp-101
    deps:
    - experimentos/exp-101.yaml
    - experimentos/base.yaml
    outs:
    - data/exp-101/escenarios.json
  entrenar-exp-101-s0:
    cmd: nice -n 10 python -m expedicion entrenar exp-101 --semilla 0
    deps:
    - experimentos/exp-101.yaml
    - experimentos/base.yaml
    - robots/bipedo-v2.xml
    outs:
    - models/exp-101/semilla-0
  evaluar-exp-101:
    cmd: nice -n 10 python -m expedicion evaluar exp-101
    deps:
    - data/exp-101/escenarios.json
    - models/exp-101/semilla-0
    outs:
    - data/exp-101/trayectorias.jsonl
    metrics:
    - metrics/exp-101/evaluacion.json:
        cache: false
  progreso-exp-101:
    cmd: nice -n 10 python -m expedicion progreso exp-101
    deps:
    - metrics/exp-101/evaluacion.json
    metrics:
    - metrics/exp-101/progreso.json:
        cache: false
  regresion-exp-101:
