# Generado por `expedicion pipeline`. El código queda fijado por el tag de cada experimento.
stages:
  escenarios-exp-001:
    cmd: python -m expedicion escenarios exp-001
    deps:
    - experimentos/exp-001.yaml
    - experimentos/base.yaml
    outs:
    - data/exp-001/escenarios.json
  entrenar-exp-001-s0:
    cmd: nice -n 10 python -m expedicion entrenar exp-001 --semilla 0
    deps:
    - experimentos/exp-001.yaml
    - experimentos/base.yaml
    - robots/bipedo-v1.xml
    outs:
    - models/exp-001/semilla-0
  entrenar-exp-001-s1:
    cmd: nice -n 10 python -m expedicion entrenar exp-001 --semilla 1
    deps:
    - experimentos/exp-001.yaml
    - experimentos/base.yaml
    - robots/bipedo-v1.xml
    outs:
    - models/exp-001/semilla-1
  evaluar-exp-001:
    cmd: nice -n 10 python -m expedicion evaluar exp-001
    deps:
    - data/exp-001/escenarios.json
    - models/exp-001/semilla-0
    - models/exp-001/semilla-1
    outs:
    - data/exp-001/trayectorias.jsonl
    metrics:
    - metrics/exp-001/evaluacion.json:
        cache: false
  progreso-exp-001:
    cmd: nice -n 10 python -m expedicion progreso exp-001
    deps:
    - metrics/exp-001/evaluacion.json
    metrics:
    - metrics/exp-001/progreso.json:
        cache: false
